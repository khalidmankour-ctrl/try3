<!--
  Adapt values in ALL CAPS. Keep title <=60 chars, description <=155 chars.
  Drop any block (Open Graph, Twitter Card) the project doesn't need rather
  than shipping it half-filled with placeholder values.
-->
<title>PAGE TITLE — BRAND NAME</title>
<meta name="description" content="ONE TO TWO SENTENCES DESCRIBING THIS SPECIFIC PAGE, WRITTEN TO EARN A CLICK." />
<link rel="canonical" href="https://example.com/canonical-path" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Open Graph (Facebook, LinkedIn, etc.) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="PAGE TITLE" />
<meta property="og:description" content="SAME OR SIMILAR TO META DESCRIPTION" />
<meta property="og:url" content="https://example.com/canonical-path" />
<meta property="og:image" content="https://example.com/path/to/share-image.jpg" />
<meta property="og:site_name" content="BRAND NAME" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="PAGE TITLE" />
<meta name="twitter:description" content="SAME OR SIMILAR TO META DESCRIPTION" />
<meta name="twitter:image" content="https://example.com/path/to/share-image.jpg" />

<!-- Only if this exact page should NOT be indexed -->
